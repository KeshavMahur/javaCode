server:
  port: 8085

spring:
  application:
    name: API-GATEWAY

  config:
    import: optional:configserver:http://localhost:8086


  cloud:
    gateway:
      routes:
        - id: HOTEL-SERVICE
          uri: lb://HOTELSERVICE
          predicates:
            - Path=/hotel/**

        - id: RATING-SERVICE
          uri: lb://RATINGSERVICE
          predicates:
            - Path=/rating/**

        - id: USER-SERVICE
          uri: lb://USERSERVICE
          predicates:
            - Path=/users/**


